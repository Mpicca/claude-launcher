name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk claude-launcher-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: claude-launcher-debug-apk
          path: claude-launcher-debug.apk
          if-no-files-found: error

      # Stable, no-login download link: https://github.com/<owner>/<repo>/releases/download/latest/claude-launcher-debug.apk
      - name: Publish "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f latest
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest claude-launcher-debug.apk --clobber
            gh release edit latest --notes "Debug APK built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          else
            gh release create latest claude-launcher-debug.apk --prerelease \
              --title "Latest debug build" \
              --notes "Debug APK built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          fi
